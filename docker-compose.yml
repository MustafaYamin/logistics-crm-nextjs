version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: crm_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "Ironman2005"
      MYSQL_DATABASE: bulk_crm
      MYSQL_USER: admin
      MYSQL_PASSWORD: "Ironman@2005"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

