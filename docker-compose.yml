version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "Ironman2005"
      POSTGRES_DB: bulk_crm
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: crm_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:Ironman2005@postgres:5432/bulk_crm?schema=public
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - postgres

volumes:
  pg_data:
